{ic:'📞',t:'Проверяйте другим способом',x:'Странный звонок или сообщение от «банка» или «друга»? Прервите разговор и свяжитесь сами: по номеру на карте, голосом, через общих знакомых.',ex:'Положите трубку и перезвоните сами. Это самое надёжное правило.'},

function welcome(){
  run++;
  app.innerHTML=`<div class="th"><div class="thc"><span>🛡️</span><h2>Не дай себя обмануть</h2><p>Мошенники в интернете каждый день придумывают новые уловки. Это игра-тренажёр для всей семьи: дети, родители, бабушки и дедушки узнают, как распознать обман и не поддаться давлению.</p><div class="ex"><b>Что вас ждёт</b><br>1. Короткая теория: ${T.length} карточек<br>2. Переписки с мошенниками: выбирайте, как ответить<br>3. Разбор: чем опасен каждый ответ и как на вас давили</div></div><div class="thb"><button class="btn" id="st">Начать</button></div></div>`;
  app.querySelector('#st').onclick=askGames;
}
function askGames(){
  run++;
  app.innerHTML=`<div class="th"><div class="thc"><span>🎮</span><h2>Один вопрос</h2><p>Вы играете в компьютерные или телефонные игры? От этого зависит, будет ли в игре переписка про игры. Ответ можно изменить на главном экране.</p></div><div class="thb" style="flex-direction:column"><button class="btn" id="y">Да, играю</button><button class="btn" id="n" style="background:var(--card);color:var(--blue)">Нет, не играю</button></div></div>`;
  app.querySelector('#y').onclick=()=>{gamer=1;theory(0)};
  app.querySelector('#n').onclick=()=>{gamer=0;theory(0)};
}
function theory(k=0){
  run++;const c=T[k],last=k===T.length-1;
  app.innerHTML=`<div class="th"><div class="thtop"><button id="sk">Пропустить</button></div>
  <div class="thc"><span>${c.ic}</span><h2>${c.t}</h2><p>${c.x}</p><div class="ex">💡 ${c.ex}</div></div>
  <div class="pg">${T.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>
  <div class="thb">${k?'<button class="btn" id="bk" style="background:var(--card);color:var(--blue)">Назад</button>':''}<button class="btn" id="nx">${last?'Начать квест 🚀':'Дальше'}</button></div></div>`;
  const nx=()=>last?home():theory(k+1),bk=()=>k&&theory(k-1);
  app.querySelector('#nx').onclick=nx;app.querySelector('#sk').onclick=home;
  if(k)app.querySelector('#bk').onclick=bk;
  let x0=null;const el=app.querySelector('.thc');
  el.ontouchstart=e=>x0=e.touches[0].clientX;
  el.ontouchend=e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(d<-50)nx();else if(d>50)bk()};
}
function celebrate(emoji,text,big){
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w=$(`<div class="win"><span>${emoji}</span><b></b></div>`);w.querySelector('b').textContent=text;document.body.appendChild(w);
  setTimeout(()=>w.remove(),2300);
  if(navigator.vibrate)navigator.vibrate([20,40,20,40,60]);
  if(calm)return;
  const c=document.createElement('canvas');c.className='cf';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de'];
  const P=Array.from({length:big?260:140},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*(big?22:16),vy:-Math.random()*(big?20:15)-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const end=performance.now()+(big?4500:3000);
  (function f(t){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,Math.min(1,(end-t)/800));x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(t<end)requestAnimationFrame(f);else c.remove();
  })(performance.now());
}
function home(){
  run++;const V=S.map((_,i)=>i).filter(i=>gamer||!S[i].game);
  const sh=V.filter(i=>res[i]==='good').length,pl=V.filter(i=>res[i]).length,tot=V.length;
  app.innerHTML=`<div class="pad"><h1>Не попадись!</h1><p class="sub">Вам пишут в чатах. Выбирайте ответы и обсуждайте вместе всей семьёй. После каждого чата придёт уведомление: решите, открывать ли его.</p></div>
  <div class="list"><div class="item" id="thi"><div class="av">📖</div><div><b>Теория</b><small>${T.length} карточек перед игрой</small></div><div class="st">›</div></div>${V.map(i=>{const s=S[i];return `<div class="item" data-i="${i}"><div class="av">${s.a}</div><div><b>${s.n}</b><small>${s.pre}</small></div><div class="st">${res[i]==='good'?'✅':res[i]==='bad'?'⚠️':'›'}</div></div>`}).join('')}
  <div class="item" id="gm"><div class="av">🎮</div><div><b>Играю в игры: ${gamer?'да':'нет'}</b><small>Нажмите, чтобы изменить</small></div><div class="st">›</div></div>
  <div class="box"><b>${'🛡️'.repeat(sh)}${'▫️'.repeat(tot-sh)}</b>${pl<tot?'Щиты за пройденные чаты':sh===tot?'Вы неуязвимы для мошенников!':'Пройдите заново, чтобы собрать все щиты'}</div>
  <div class="box">Уведомления: верных решений ${stat.ok} · ошибок ${stat.bad}</div></div>`;
  app.querySelectorAll('.item[data-i]').forEach(e=>e.onclick=()=>chat(+e.dataset.i));
  app.querySelector('#thi').onclick=()=>theory(0);
  app.querySelector('#gm').onclick=()=>{gamer=gamer?0:1;home()};
  live=1;
  if(pending){pending=0;setTimeout(notify,sh===tot?4800:700)}

  if(sh<tot)home.won=0;
}
function chat(i){
  const id=++run,s=S[i],used=new Set();
  app.innerHTML=`<div class="nav"><button>‹ Чаты</button><div><span>${s.a}</span>${s.n}</div><span style="width:80px"></span></div><div class="chat"></div><div class="opts"></div>`;
  app.querySelector('button').onclick=home;
  const box=app.querySelector('.chat'),opts=app.querySelector('.opts');
  const down=()=>box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
  async function play(key){
    const n=s.nodes[key];
    for(const t of (n.m||[])){
      const d=$('<div class="b in dots"><i></i><i></i><i></i></div>');box.appendChild(d);down();
      await wait(900+t.length*14);if(id!==run)return;
      const [tx,tg]=t.split('||');d.className='b in';d.textContent=tx;if(tg)used.add(tg);down();
    }
    if(n.items){
      const items=[...n.items].sort(()=>Math.random()-.5);
      const site=$(`<div class="site"><div class="url"><span class="ns">⚠️ Не защищено</span>${n.url}</div></div>`);
      items.forEach(it=>{const e=$('<div class="si"></div>');e.textContent=it[0];e.onclick=()=>e.classList.toggle('mk');e._i=it;site.appendChild(e)});
      box.appendChild(site);down();
      opts.innerHTML='';const ck=$('<button class="opt">Проверить сайт</button>');opts.appendChild(ck);
      ck.onclick=()=>{
        opts.innerHTML='';let f=0,tot=0;
        site.querySelectorAll('.si').forEach(e=>{const it=e._i,mk=e.classList.contains('mk');
          if(it[1])tot++;
          if(it[1]){e.classList.add(mk?'ok':'miss');if(mk)f++}
          const sm=$('<small></small>');sm.textContent=(it[1]?(mk?'✅ ':'⚠️ Пропущено: '):(mk?'Не признак: ':''))+(it[1]||mk?it[2]:'');
          if(it[1]||mk)e.appendChild(sm);e.classList.remove('mk');e.onclick=null});
        box.appendChild($('<div class="b in"></div>')).textContent=`Найдено признаков: ${f} из ${tot}.`;down();
        play(n.next);
      };return;
    }
    const end=key.startsWith('bad')?'bad':key.startsWith('good')?'good':null;
    if(end){
      res[i]=end;pending=1;
      box.appendChild($(`<div class="verdict ${end}"><h3>${end==='good'?'✅':'⚠️'} ${n.t}</h3>${n.x}${used.size?`<div class="psy">🎭 <b>Приёмы, которые применяли к вам в этой переписке:</b> ${[...used].join(' · ')}.</div>`:''}${s.psy?`<div class="psy">🧠 <b>Как на вас давили:</b> ${s.psy}</div>`:''}</div>`));down();
      if(end==='good')celebrate('🛡️','Щит получен!');else if(navigator.vibrate)navigator.vibrate([30,40,30]);
      opts.innerHTML='';opts.style.cssText='padding:0;border:0;background:var(--bg)';
      const b=$('<button class="btn">К чатам</button>');b.onclick=home;
      const r=$('<button class="btn" style="background:var(--card);color:var(--blue)">Пройти заново</button>');r.onclick=()=>chat(i);
      opts.append(b,r);return;
    }
    opts.innerHTML='';
    [...n.c].sort(()=>Math.random()-.5).forEach(([t,nx])=>{const o=$('<button class="opt"></button>');o.textContent=t;
      o.onclick=()=>{opts.innerHTML='';box.appendChild($('<div class="b out"></div>')).textContent=t;down();play(nx)};opts.appendChild(o)});
    down();
  }
  play('s');
}
function notify(){
  if(document.querySelector('.banner')||document.querySelector('.ov'))return;
  if(!queue.length)queue=N.map((_,i)=>i).sort(()=>Math.random()-.5);
  const n=N[queue.pop()];
  const blk=$('<div class="blk"></div>');
  const el=$(`<div class="banner"><div class="bi">${n.ic}</div><div class="bt"><small>${n.app} · сейчас</small><b></b><span></span><div class="bq">Откроете это уведомление?</div><div class="bb"><button class="o">Открыть</button><button class="c">Не открывать</button></div></div></div>`);
  el.querySelector('b').textContent=n.t;el.querySelector('.bt span').textContent=n.b;
  const fin=open=>{
    el.classList.add('out');blk.remove();setTimeout(()=>el.remove(),300);
    let h,note='';
    if(n.trap&&open){stat.bad++;h='⚠️ Вы попались!'}
    else if(n.trap){stat.ok++;h='✅ Верно, это ловушка'}
    else if(open){stat.ok++;h='👍 Верно, это безопасно'}
    else{stat.ok++;h='🙂 Это было безопасно';note=' Осторожность не повредит, но обычные сообщения без просьб о деньгах можно открывать.'}
    const ov=$(`<div class="ov"><div class="mod"><h3>${h}</h3><p></p><button class="btn">Понятно</button></div></div>`);
    ov.querySelector('p').textContent=n.x+note;ov.querySelector('.btn').onclick=()=>{ov.remove();if(document.querySelector('#thi'))home()};
    document.body.appendChild(ov);
    if(navigator.vibrate)navigator.vibrate(n.trap&&open?[30,40,30]:20);
  };
  el.querySelector('.o').onclick=()=>fin(true);el.querySelector('.c').onclick=()=>fin(false);
  document.body.append(blk,el);
  if(navigator.vibrate)navigator.vibrate(15);
}
